[project]
name = "6-multi-ai-agent"
version = "0.1.0"
description = "Multi-Agent AI project using LangChain"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core LLM + LangChain ecosystem
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "streamlit>=1.0.0",
    # Tavily Search Tool
    "tavily-python>=0.3.0",
    # Web scraping
    "beautifulsoup4>=4.12.0",
    "readability-lxml",
    "trafilatura",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    # Environment variables
    "python-dotenv>=1.0.0",
    # Logging / debugging
    "rich>=13.7.0",
    "ipykernel>=7.3.0",
    "langchain-google-genai>=4.4.0",
]
